<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Optimización de CV</title>
    <style>
        :root {
            --bg-color: #f4f4f5;
            --panel-bg: #ffffff;
            --text-main: #333333;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --editor-red: #dc2626;
            --border: #e5e7eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
        }
        .panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .left-panel {
            flex: 1;
            border-right: 1px solid var(--border);
        }
        .right-panel {
            flex: 1.5;
            font-family: "Georgia", serif; /* Tipografía editorial según doc */
            line-height: 1.6;
        }
        h1, h2, h3 {
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: monospace; /* CV en bruto monoespaciado según doc */
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }
        
        /* Estilos del editor (Right Panel) */
        .ats-score {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px;
            background: #f0fdf4;
            border-left: 4px solid #16a34a;
            font-family: sans-serif;
        }
        .editor-note {
            color: var(--editor-red);
            font-style: italic;
            font-size: 0.9em;
            margin-top: 4px;
            display: block;
        }
        .original-text {
            text-decoration: line-through;
            color: #6b7280;
            font-size: 0.9em;
        }
        .improved-text {
            font-weight: 500;
            color: #111827;
        }
        .keywords-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .keyword-chip {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 4px 8px;
            border-radius: 16px;
            font-size: 12px;
            font-family: sans-serif;
        }
        
        #loading {
            display: none;
            text-align: center;
            font-family: sans-serif;
            color: var(--primary);
            margin-top: 20px;
        }
        #error-message {
            display: none;
            color: var(--editor-red);
            background: #fee2e2;
            padding: 10px;
            border-radius: 4px;
            margin-top: 20px;
            font-family: sans-serif;
        }
        #results {
            display: none;
        }
    </style>
</head>
<body>

    <div class="panel left-panel">
        <h2>Ingreso de Datos</h2>
        <div class="form-group">
            <label for="targetRole">Puesto Objetivo *</label>
            <input type="text" id="targetRole" placeholder="Ej: Analista de Datos Jr." required>
        </div>
        <div class="form-group">
            <label for="cvText">Texto del CV (en bruto) *</label>
            <textarea id="cvText" rows="12" placeholder="Pega aquí el contenido de tu currículum..." required></textarea>
        </div>
        <div class="form-group">
            <label for="jobDescription">Descripción del Puesto (Opcional)</label>
            <textarea id="jobDescription" rows="6" placeholder="Pega aquí la oferta de trabajo si la tienes..."></textarea>
        </div>
        <button id="optimizeBtn">Optimizar CV con IA</button>
        
        <div id="loading">Analizando y optimizando tu CV... ⏳</div>
        <div id="error-message"></div>
    </div>

    <div class="panel right-panel">
        <h2>Escritorio de Edición</h2>
        <div id="empty-state" style="color: #6b7280; font-style: italic;">
            Ingresa tu CV a la izquierda y presiona "Optimizar" para ver las sugerencias de mejora.
        </div>
        
        <div id="results">
            <div class="ats-score">
                Puntaje ATS Estimado: <span id="scoreValue"></span>/100
            </div>

            <h3>Resumen Profesional</h3>
            <p class="original-text" id="summaryOriginal"></p>
            <p class="improved-text" id="summaryImproved"></p>

            <h3>Experiencia Laboral</h3>
            <div id="experienceList"></div>

            <h3 style="margin-top: 24px; font-family: sans-serif; font-size: 16px;">Palabras Clave Faltantes (ATS)</h3>
            <div class="keywords-container" id="keywordsList"></div>

            <h3 style="margin-top: 24px; font-family: sans-serif; font-size: 16px;">Recomendaciones del Editor</h3>
            <ul id="recommendationsList" style="font-family: sans-serif; font-size: 14px;"></ul>
        </div>
    </div>

    <script>
        // Configuración de la IA
        const API_KEY = ''; // Agrega tu API key aquí si deseas que funcione real

        document.getElementById('optimizeBtn').addEventListener('click', async () => {
            const role = document.getElementById('targetRole').value.trim();
            const cv = document.getElementById('cvText').value.trim();
            const jobDesc = document.getElementById('jobDescription').value.trim();

            if (!role || !cv) {
                showError("El Puesto Objetivo y el Texto del CV son obligatorios.");
                return;
            }

            // Preparar UI
            hideError();
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('optimizeBtn').disabled = true;

            try {
                let responseJSON;

                if (API_KEY) {
                    // Lógica real de API iría aquí
                } else {
                    // Simulación basada en los Casos de Uso del documento para probar la UI
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    responseJSON = {
                        "ats_score": 58,
                        "summary_original": "Estudiante avanzado. Experiencia como encargado de caja.",
                        "summary_improved": "Profesional orientado a resultados con experiencia sólida en manejo de datos numéricos y soporte a procesos contables.",
                        "experience_items": [
                            {
                                "original": "hacía tareas de oficina y archivo",
                                "improved": "Gestionó la organización de información y brindó soporte clave a procesos contables, asegurando precisión de datos.",
                                "editor_note": "Nota del editor: Se cambió a verbos de acción y se resaltó la relación con el análisis de datos."
                            }
                        ],
                        "missing_keywords": ["Excel avanzado", "Tablas dinámicas", "SQL", "Power BI"],
                        "recommendations": [
                            "Sumar un proyecto personal o curso corto que demuestre manejo de herramientas de análisis explícitamente.",
                            "Cuantificar las descripciones agregando métricas de volumen."
                        ]
                    };
                }

                renderResults(responseJSON);

            } catch (error) {
                showError("Error procesando el CV. " + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('optimizeBtn').disabled = false;
            }
        });

        function renderResults(data) {
            document.getElementById('results').style.display = 'block';
            
            document.getElementById('scoreValue').textContent = data.ats_score;
            document.getElementById('summaryOriginal').textContent = escapeHTML(data.summary_original || '');
            document.getElementById('summaryImproved').textContent = escapeHTML(data.summary_improved || '');

            const expContainer = document.getElementById('experienceList');
            expContainer.innerHTML = '';
            (data.experience_items || []).forEach(item => {
                const div = document.createElement('div');
                div.style.marginBottom = '16px';
                div.innerHTML = `
                    <div class="original-text">${escapeHTML(item.original)}</div>
                    <div class="improved-text">${escapeHTML(item.improved)}</div>
                    <div class="editor-note">✎ ${escapeHTML(item.editor_note)}</div>
                `;
                expContainer.appendChild(div);
            });

            const kwContainer = document.getElementById('keywordsList');
            kwContainer.innerHTML = '';
            (data.missing_keywords || []).forEach(kw => {
                const span = document.createElement('span');
                span.className = 'keyword-chip';
                span.textContent = escapeHTML(kw);
                kwContainer.appendChild(span);
            });

            const recContainer = document.getElementById('recommendationsList');
            recContainer.innerHTML = '';
            (data.recommendations || []).forEach(rec => {
                const li = document.createElement('li');
                li.style.marginBottom = '8px';
                li.textContent = escapeHTML(rec);
                recContainer.appendChild(li);
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        function showError(msg) {
            const errDiv = document.getElementById('error-message');
            errDiv.textContent = msg;
            errDiv.style.display = 'block';
        }
        function hideError() { document.getElementById('error-message').style.display = 'none'; }
    </script>
</body>
</html>
